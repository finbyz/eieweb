{% if frappe.session.user == 'Guest' %}
<div id="inquiry-form-section" class="inquiry-form-section ad-campaign-form">
    <div class="container">
        <div class="row">
            <div class="col-md-6 bg-white inquiry-form-fields">
                <div id="inquiry-form">
                    <form id="inquiry" name="contact" class="inquiry-main ml-auto position-relative" accept-charset="utf-8">
                        <h5 class="pt-2 text-center">INQUIRE NOW</h5>
                        
                        <div class="form-group">
                            <img width="20" src="/files/name.svg" alt="name" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <input class="form-control inquiry-input ml-5" name="lead_name" type="text" id="lead_name" placeholder="Name" autocomplete="off" required>
                        </div>
                        
                        <div class="form-group">
                            <img width="20" src="/files/teamwork.svg" alt="company name" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <input class="form-control inquiry-input ml-5" name="company_name" type="text" id="company_name" placeholder="Organization Name" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <img width="20" src="/files/location-dot-solid.svg" alt="city" class="input-icons ml-1">
                            
                            <span class="line ml-1"></span>
                            <input class="form-control inquiry-input ml-5" name="city" type="text" id="city" placeholder="City" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <img width="20" src="/files/email_white.svg" alt="Email" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <input class="form-control inquiry-input ml-5" name="email" type="email" id="email" placeholder="Email" autocomplete="off" required>
                        </div>
                        
                        <div class="form-group">
                            <img width="20" src="/files/phone_white.svg" alt="Mobile number" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <input class="form-control inquiry-input ml-5" name="mobile_no" id="phone" placeholder="Mobile No" type="text" maxlength="15" autocomplete="off" required>
                        </div>
                        
                        <div class="form-group">
                            <img width="20" src="/files/open-box.svg" alt="requirments" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <textarea class="form-control inquiry-input ml-5" name="requirments" id="requirments" placeholder="Requirments" autocomplete="off" rows="2" cols="50" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <img width="20" src="/files/messenger.svg" alt="message" class="input-icons ml-1">
                            <span class="line ml-1"></span>
                            <textarea class="form-control inquiry-input ml-5" name="message" id="message" placeholder="Message" autocomplete="off" rows="2" cols="50" required></textarea>
                        </div>
                        
                        <div class="text-center mt-2 d-flex justify-content-around">
                            <button class="submit-button" name="submit" type="submit" value="Send">Submit</button>
                            <a class="reset-button" href="javascript:void(0);">Reset</a>
                        </div>
                        
                        <div id="campaign_enquire_btn" class="enquire-btn d-flex">
                            <p class="pr-2 d-flex">
                                <img width="15" src="/files/inquiry-right.svg" class="pt-2 active" alt="Inquiry right arrow" id="rightArrow">
                                <img width="15" src="/files/inquiry-left.svg" class="pt-2 deactivated" alt="Inquiry left arrow" id="leftArrow">
                                <span class="pr-2 pl-2 pb-2">INQUIRY</span>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        $(document).ready(function () {
            var isOpened = false;
            
            $('#campaign_enquire_btn').on('click', function () {
                if (isOpened) {
                    $('#inquiry-form-section').removeClass('slide-right active');
                } else {
                    $('#inquiry-form-section').addClass('slide-right active');
                }
                isOpened = !isOpened;
                toggleArrows();
            });
            
            $(window).scroll(function () {
                if ($(window).scrollTop() >= 7000 && !isOpened) {
                    $('#inquiry-form-section').addClass('slide-right active');
                    isOpened = true;
                    toggleArrows();
                }
            });
            
            $('.reset-button').on('click', function () {
                $("#inquiry :input").val('');
            });
            
            function toggleArrows() {
                if (isOpened) {
                    $('#rightArrow').removeClass('active').addClass('deactivated');
                    $('#leftArrow').removeClass('deactivated').addClass('active');
                } else {
                    $('#leftArrow').removeClass('active').addClass('deactivated');
                    $('#rightArrow').removeClass('deactivated').addClass('active');
                }
            }
        });
    </script>
</div>
{% endif %}
